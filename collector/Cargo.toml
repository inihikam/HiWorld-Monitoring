[package]
name = "hiworld-collector"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "hiworld-monitoring collector: polls agents, stores metrics, serves UI"

[dependencies]
hiworld-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
axum = "0.8"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
bcrypt = "0.17"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
wiremock = "0.6"
