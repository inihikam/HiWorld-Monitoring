[package]
name = "hiworld-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "hiworld-monitoring agent: samples /proc and serves snapshots"

[dependencies]
hiworld-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
axum = "0.8"
tracing = "0.1"

thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
